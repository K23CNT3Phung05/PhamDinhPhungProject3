<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá dịch vụ | PDP Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --accent-color: #6366f1;
            --gold: #ffb100;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .review-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 600px;
            margin: auto;
        }
        .order-info-mini {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
        }
        /* Star Rating */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 15px;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 3rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .star-rating input:checked ~ label { color: var(--gold); transform: scale(1.1); }
        .star-rating label:hover, .star-rating label:hover ~ label { color: #ffca28; }

        .btn-submit-review {
            background: linear-gradient(135deg, #ffcc00, #ffb100);
            color: #451a03;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(255, 177, 0, 0.3);
            transition: 0.3s;
        }
        .btn-submit-review:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 177, 0, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="review-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="bi bi-chat-heart fs-1"></i>
            </div>
            <h2 class="fw-bold">Đánh giá đơn hàng</h2>
            <p class="text-muted">Cảm ơn bạn đã tin dùng PDP Restaurant</p>
        </div>

        <div class="order-info-mini d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted small">Mã đơn hàng:</span>
                <div class="fw-bold">#[[${order.id}]]</div>
            </div>
            <div class="text-end">
                <span class="text-muted small">Ngày giao:</span>
                <div class="fw-bold">[[${#temporals.format(order.createdAt,'dd/MM/yyyy')}]]</div>
            </div>
        </div>

        <form th:action="@{/orders/{id}/review(id=${order.id})}" method="post">
            <div class="mb-4">
                <label class="d-block text-center fw-bold mb-2">Bạn chấm mấy sao cho món ăn?</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required/><label for="star5"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star4" name="rating" value="4"/><label for="star4"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star3" name="rating" value="3"/><label for="star3"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star2" name="rating" value="2"/><label for="star2"><i class="bi bi-star-fill"></i></label>
                    <input type="radio" id="star1" name="rating" value="1"/><label for="star1"><i class="bi bi-star-fill"></i></label>
                </div>
            </div>

            <div class="form-floating mb-4">
                <textarea name="comment" class="form-control" placeholder="Để lại bình luận" id="comment" style="height: 120px; border-radius: 20px;"></textarea>
                <label for="comment">Mời bạn chia sẻ thêm cảm nhận...</label>
            </div>

            <button type="submit" class="btn-submit-review">GỬI ĐÁNH GIÁ CỦA BẠN</button>
            <a th:href="@{/orders/list}" class="btn btn-link w-100 mt-3 text-muted text-decoration-none">Quay lại danh sách</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
