<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Bàn Trực Tuyến | PDP Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --gold-hover: #e2c275;
            --bg-dark: #0a0d0c;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .booking-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .info-section {
            background: linear-gradient(135deg, #0a0d0c 0%, #1a1a1a 100%);
            padding: 50px;
            border-right: 1px solid rgba(197, 160, 89, 0.1);
        }

        .form-section { padding: 50px; }

        .gold-text { color: var(--gold); }

        .label-custom {
            color: var(--gold);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-control, .form-select {
            background: var(--glass) !important;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff !important;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }

        .btn-booking {
            background: linear-gradient(45deg, #b38e44, #e2c275);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px;
            border: none;
            width: 100%;
            margin-top: 20px;
            transition: 0.4s;
        }

        .btn-booking:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3);
            filter: brightness(1.1);
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid #dc3545;
            color: #ff8080;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="booking-card row g-0">
        <div class="col-lg-5 info-section d-none d-lg-flex flex-column justify-content-center text-center">
            <h1 class="gold-text fw-bold display-4 mb-4">PDP</h1>
            <h4 class="text-uppercase letter-spacing-2 mb-4">Restaurant</h4>
            <div class="divider mx-auto mb-4" style="width: 50px; height: 2px; background: var(--gold);"></div>
            <p class="lead opacity-75">Tận hưởng hương vị ẩm thực đỉnh cao trong không gian sang trọng bậc nhất.</p>
            <div class="mt-4">
                <p><i class="fas fa-map-marker-alt me-2 gold-text"></i> Quận 1, TP. Hồ Chí Minh</p>
                <p><i class="fas fa-phone-alt me-2 gold-text"></i> 1900 1234</p>
            </div>
        </div>

        <div class="col-lg-7 form-section">
            <h2 class="mb-4 text-center text-lg-start">Đặt Bàn Trực Tuyến</h2>

            <div th:if="${errorMessage}" class="alert-error animate__animated animate__shakeX">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/reservations/save}" th:object="${res}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="label-custom">Họ và Tên</label>
                        <input type="text" th:field="*{customerName}" class="form-control" placeholder="" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="label-custom">Số Điện Thoại</label>
                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="label-custom">Ngày Đến</label>
                        <input type="date" th:field="*{reservationDate}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="label-custom">Giờ Đến</label>
                        <input type="time" th:field="*{reservationTime}" class="form-control" required>
                    </div>
                    <div class="col-md-12 mb-4">
                        <label class="label-custom">Số Lượng Khách</label>
                        <select th:field="*{numberOfPeople}" class="form-select select-luxury">
                            <option value="1">01 Người (Cá nhân)</option>
                            <option value="2">02 Người (Hẹn hò)</option>
                            <option value="4">04 Người (Gia đình)</option>
                            <option value="6">06 Người (Tiệc nhỏ)</option>
                            <option value="10">10+ Người (Liên hệ trực tiếp)</option>
                        </select>
                    </div>

                    <style>
                        /* CSS bổ sung cho select đẹp hơn */
                        .select-luxury {
                            cursor: pointer;
                            appearance: none;
                            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23c5a059' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
                            background-repeat: no-repeat;
                            background-position: right 1rem center;
                            background-size: 16px 12px;
                        }
                        .select-luxury option { background-color: #1a1a1a; color: #fff; }
                    </style>
                </div>
                <button type="submit" class="btn-booking">Xác Nhận Đặt Bàn Ngay</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
