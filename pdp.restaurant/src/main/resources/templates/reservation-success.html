<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạng Thái Đặt Bàn | PDP Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c5a059;
            --gold-light: #e2c275;
            --bg-dark: #0a0d0c;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0d0c 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .status-container {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 40px;
            border-radius: 28px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
        }

        h2 { font-family: 'Playfair Display', serif; letter-spacing: 1px; }

        /* Icon chúc mừng */
        .celebration-icon {
            font-size: 60px;
            background: linear-gradient(135deg, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        /* Thẻ hiển thị đơn vừa đặt */
        .latest-booking-card {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group-custom {
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }

        .input-group-custom input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 15px;
            flex: 1;
            outline: none;
        }

        .btn-search {
            background: var(--gold);
            border: none;
            color: #000;
            padding: 0 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-search:hover { background: var(--gold-light); transform: scale(1.05); }

        /* Danh sách lịch sử */
        .history-item {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .history-item:hover { border-color: var(--gold); }

        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-waiting { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid #ffc107; }
        .status-confirmed { background: rgba(40, 167, 69, 0.15); color: #28a745; border: 1px solid #28a745; }
        .status-cancelled { background: rgba(220, 53, 69, 0.15); color: #dc3545; border: 1px solid #dc3545; }

        .btn-back {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
        }
        .btn-back:hover { color: #fff; transform: translateX(-5px); }
    </style>
</head>
<body>

<div class="status-container animate__animated animate__fadeIn">

    <div th:if="${success}" class="animate__animated animate__zoomIn">
        <div class="celebration-icon"><i class="fas fa-glass-cheers"></i></div>
        <h2 class="gold-text">ĐẶT BÀN THÀNH CÔNG!</h2>
        <p class="opacity-75">Cảm ơn quý khách đã lựa chọn PDP Restaurant.</p>

        <div class="latest-booking-card" th:if="${latestRes}">
            <div class="small text-uppercase gold-text fw-bold mb-2">Thông tin đơn hàng</div>
            <div class="d-flex justify-content-between px-3">
                <span>Ngày: <strong th:text="${latestRes.reservationDate}"></strong></span>
                <span>Giờ: <strong th:text="${latestRes.reservationTime}"></strong></span>
            </div>
            <hr class="my-2 opacity-25">
            <div class="small opacity-75">Mã đơn đã được lưu hệ thống, vui lòng chờ nhân viên gọi xác nhận.</div>
        </div>
    </div>

    <div class="search-box">
        <h5 class="gold-text mb-4"><i class="fas fa-search me-2"></i> TRA CỨU TRẠNG THÁI DUYỆT BÀN</h5>

        <form th:action="@{/check-reservation}" method="get">
            <div class="input-group-custom mb-4">
                <input type="tel" name="phone" placeholder="Nhập số điện thoại đã đặt bàn..."
                       th:value="${searchedPhone}" required>
                <button type="submit" class="btn-search">XÁC NHẬN</button>
            </div>
        </form>

        <div th:if="${searchResults}" class="animate__animated animate__fadeInUp">
            <div th:each="item : ${searchResults}" class="history-item">
                <div>
                    <div class="fw-bold" th:text="${item.reservationDate} + ' | ' + ${item.reservationTime}"></div>
                    <div class="small opacity-50" th:text="${item.customerName} + ' - ' + ${item.numberOfPeople} + ' người'"></div>
                </div>

                <div class="status-pill"
                     th:classappend="${item.status == 'ĐÃ XÁC NHẬN' ? 'status-confirmed' : (item.status == 'ĐÃ HỦY' ? 'status-cancelled' : 'status-waiting')}"
                     th:text="${item.status}">
                </div>
            </div>

            <div th:if="${searchResults.isEmpty()}" class="py-3 text-danger">
                <i class="fas fa-times-circle me-2"></i> Không tìm thấy đơn hàng nào gắn với số điện thoại này.
            </div>
        </div>
    </div>

    <a href="/" class="btn-back">
        <i class="fas fa-arrow-left me-2"></i> QUAY LẠI TRANG CHỦ
    </a>
</div>

</body>
</html>
