<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ADMIN - Category List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-3">📂 QUẢN LÝ DANH MỤC</h2>

    <!-- THÔNG BÁO -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <a href="/admin/categories/create" class="btn btn-primary mb-3">
        ➕ Thêm danh mục
    </a>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên danh mục</th>
            <th>Mô tả</th>
            <th width="180">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td>
                <a th:href="@{/admin/categories/edit/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">✏ Sửa</a>

                <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Xóa danh mục này?')">🗑 Xóa</a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="4" class="text-center text-muted">
                Chưa có danh mục nào
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
