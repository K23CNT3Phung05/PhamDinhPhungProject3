<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đặt Bàn - PDP Restaurant (Light Mode)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8f9fa; /* Màu nền sáng porcelain */
            --glass-bg: #ffffff;
            --accent-gold: #b8860b; /* Vàng đậm sang trọng */
            --text-main: #2c3e50;
            --border-color: #e9ecef;
            --emerald: #27ae60;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(#d1d1d1 0.5px, transparent 0.5px);
            background-size: 20px 20px; /* Họa tiết chấm bi mờ cho nền sáng */
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h3 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* Table Styling */
        .table {
            color: var(--text-main);
            vertical-align: middle;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .table thead th {
            border: none;
            color: #888;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 15px;
        }

        .table tbody tr {
            background: #fff;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .table tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: var(--accent-gold);
        }

        .table td {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px;
        }

        .table td:first-child { border-left: 1px solid var(--border-color); border-radius: 10px 0 0 10px; }
        .table td:last-child { border-right: 1px solid var(--border-color); border-radius: 0 10px 10px 0; }

        /* Badge Status sáng hơn */
        .badge {
            padding: 6px 12px;
            font-weight: 600;
            border-radius: 6px;
            font-size: 0.7rem;
        }
        .bg-pending { background: #fff4e5; color: #d4a017; border: 1px solid #ffeeba; }
        .bg-confirmed { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .bg-cancelled { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* Nút hành động nổi bật trên nền sáng */
        .btn-action {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin: 0 2px;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .btn-confirm { background: #e8f5e9; color: #2ecc71; }
        .btn-confirm:hover { background: #2ecc71; color: #fff; }

        .btn-cancel { background: #fff4e5; color: #f39c12; }
        .btn-cancel:hover { background: #f39c12; color: #fff; }

        .btn-delete { background: #ffebee; color: #e74c3c; }
        .btn-delete:hover { background: #e74c3c; color: #fff; }

        .capacity-indicator {
            background: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
        }

        .user-icon-circle {
            width: 35px;
            height: 35px;
            background: #f0f2f5;
            color: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-outline-gold {
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 50px;
        }
        .btn-outline-gold:hover {
            background: var(--accent-gold);
            color: #fff;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="glass-card p-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h3 class="mb-1 text-uppercase"><i class="fas fa-utensils me-2"></i>PDP Restaurant Admin</h3>
            <p class="text-muted small mb-0">Hệ thống quản lý đặt bàn trực tuyến</p>
        </div>

        <div class="capacity-indicator d-none d-md-block text-center shadow-sm">
            <small class="text-muted d-block mb-0 fw-bold" style="font-size: 0.65rem;">CÔNG SUẤT HIỆN TẠI</small>
            <span class="fw-bold fs-5" style="color: var(--accent-gold);" th:text="${occupancy ?: '0/50'}"></span>
        </div>

        <a th:href="@{/}" class="btn btn-outline-gold btn-sm px-4">
            <i class="fas fa-external-link-alt me-2"></i>TRANG CHỦ
        </a>
    </div>

    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Khách Hàng</th>
                    <th>Số Điện Thoại</th>
                    <th>Lịch Hẹn</th>
                    <th class="text-center">Khách</th>
                    <th>Trạng Thái</th>
                    <th class="text-end">Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservations}">
                    <td><span class="fw-bold text-secondary" th:text="'#' + ${r.id}"></span></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="user-icon-circle me-3">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="fw-bold" style="color: #34495e;" th:text="${r.customerName}"></span>
                        </div>
                    </td>
                    <td class="fw-medium" th:text="${r.phone}"></td>
                    <td>
                        <div class="d-flex flex-column">
                            <span class="fw-bold" th:text="${r.reservationDate}"></span>
                            <small class="text-muted"><i class="far fa-clock me-1"></i>[[${r.reservationTime}]]</small>
                        </div>
                    </td>
                    <td class="text-center">
                        <span class="badge rounded-pill bg-light text-dark border" th:text="${r.numberOfPeople} + ' người'"></span>
                    </td>
                    <td>
                        <span th:class="'badge ' + ${r.status == 'ĐANG CHỜ' ? 'bg-pending' : (r.status == 'ĐÃ XÁC NHẬN' ? 'bg-confirmed' : 'bg-cancelled')}"
                              th:text="${r.status}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/reservations/confirm/{id}(id=${r.id})}" class="btn-action btn-confirm" title="Xác nhận duyệt"><i class="fas fa-check"></i></a>
                        <a th:href="@{/admin/reservations/cancel/{id}(id=${r.id})}" class="btn-action btn-cancel" title="Hủy bàn"><i class="fas fa-times"></i></a>
                        <a th:href="@{/admin/reservations/delete/{id}(id=${r.id})}" class="btn-action btn-delete" onclick="return confirm('Xóa vĩnh viễn đơn này?')" title="Xóa bỏ"><i class="fas fa-trash-alt"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="7" class="text-center py-5">
                        <p class="text-muted">Hiện chưa có đơn đặt bàn nào.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
