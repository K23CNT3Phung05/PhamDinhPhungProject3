<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            <i class="fas fa-cogs"></i> Admin Panel
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" th:href="@{/}">
                <i class="fas fa-home"></i> Về trang chủ
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/users}">
                            <i class="fas fa-users"></i> Quản lý người dùng
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Main -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="pt-3 pb-2 mb-3 border-bottom d-flex justify-content-between align-items-center">
                <h1 class="h2"><i class="fas fa-users"></i> Quản lý người dùng</h1>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal"
                        onclick="showAddForm()"> <i class="fas fa-plus"></i> Thêm mới
                </button>
            </div>

            <div class="card">
                <div class="card-body table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>Địa chỉ</th>
                            <th>Vai trò</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.fullName}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.phone ?: 'N/A'}"></td>
                            <td th:text="${user.address ?: 'N/A'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      th:text="${user.role}"></span>
                            </td>
                            <td>
                                <button class="btn btn-warning btn-sm" data-bs-toggle="modal"
                                        data-bs-target="#userModal"
                                        th:onclick="'showEditForm(' + ${user.id} + ')'">
                                    <i class="fas fa-edit"></i> Sửa
                                </button>
                                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Xóa người dùng này?')">
                                    <i class="fas fa-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="7" class="text-center text-muted">Chưa có người dùng</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Thêm/Sửa -->
            <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form th:action="@{/admin/users/save}" method="post" th:object="${user}" id="userForm">
                            <div class="modal-header">
                                <h5 class="modal-title" id="userModalLabel">Thêm/Sửa người dùng</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" th:field="*{id}"/>

                                <div class="mb-3">
                                    <label class="form-label">Tên</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Mật khẩu</label>
                                    <input type="password" class="form-control" th:field="*{password}"
                                           placeholder="Nhập mật khẩu mới nếu muốn đổi">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">SĐT</label>
                                    <input type="text" class="form-control" th:field="*{phone}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Địa chỉ</label>
                                    <input type="text" class="form-control" th:field="*{address}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Vai trò</label>
                                    <select class="form-select" th:field="*{role}">
                                        <option value="USER">USER</option>
                                        <option value="STAFF">STAFF</option>
                                        <option value="ADMIN">ADMIN</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary">Lưu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    function showAddForm() {
        let form = document.getElementById('userForm');
        form.reset();
        document.getElementById('userModalLabel').innerText = 'Thêm người dùng';
        form.querySelector('[name="id"]').value = '';
        form.querySelector('[name="role"]').value = 'USER';
    }

    function showEditForm(id) {
        fetch('/admin/users/' + id)
            .then(response => response.json())
            .then(user => {
                let form = document.getElementById('userForm');
                form.querySelector('[name="id"]').value = user.id;
                form.querySelector('[name="fullName"]').value = user.fullName;
                form.querySelector('[name="email"]').value = user.email;
                form.querySelector('[name="password"]').value = ''; // giữ password cũ
                form.querySelector('[name="phone"]').value = user.phone || '';
                form.querySelector('[name="address"]').value = user.address || '';
                form.querySelector('[name="role"]').value = user.role;
                document.getElementById('userModalLabel').innerText = 'Sửa người dùng';
            });
    }
    /*]]>*/
</script>

</body>
</html>
