<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đánh giá | Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background:#f5f7fb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin:0; }
        .page-container { width:100%; padding:25px 40px; }
        .card-custom { border-radius:12px; padding:25px; background:#fff; box-shadow:0 6px 20px rgba(0,0,0,0.08); border:none; }
        .table thead { background: #f8f9fa; }
        .star-filled { color: #ffb100; }
        .star-empty { color: #ccc; }
        .badge-order { background: #e2e8f0; color: #475569; font-weight: 600; }
    </style>
</head>
<body>

<div class="page-container">
    <div class="card-custom">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-primary"><i class="bi bi-chat-left-heart me-2"></i>QUẢN LÝ ĐÁNH GIÁ</h2>
            <span class="badge bg-info text-dark" th:text="${reviews.size() + ' đánh giá'}">0</span>
        </div>

        <table class="table table-hover align-middle border">
            <thead class="table-light">
            <tr>
                <th>Mã Đơn</th>
                <th>Khách hàng</th>
                <th>Món ăn đã đặt</th>
                <th>Nội dung bình luận</th>
                <th>Số sao</th>
                <th>Hành động</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${reviews}">
                <td>
                    <span class="badge badge-order" th:text="'#' + ${r.id}"></span>
                </td>
                <td>
                    <div class="fw-bold" th:text="${r.customerName}">Tên khách</div>
                    <small class="text-muted" th:text="${r.customerPhone}">SĐT</small>
                </td>
                <td class="text-start">
                    <ul class="mb-0 ps-3">
                        <li th:each="item : ${r.orderItems}" class="small text-muted">
                            <span th:text="${item.dishName}">Tên món</span>
                            (x<span th:text="${item.quantity}">1</span>)
                        </li>
                    </ul>
                </td>
                <td>
                    <em th:text="${r.reviewComment != null ? r.reviewComment : 'Không có bình luận'}"></em>
                </td>
                <td>
                    <div class="star-filled">
                        <i th:each="i : ${#numbers.sequence(1, r.rating)}" class="bi bi-star-fill"></i>
                        <i th:if="${r.rating < 5}" th:each="i : ${#numbers.sequence(r.rating + 1, 5)}" class="bi bi-star star-empty"></i>
                    </div>
                </td>
                <td>
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/admin/review/delete/{id}(id=${r.id})}"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa đánh giá này không?')">
                        <i class="bi bi-trash"></i> Xóa
                    </a>
                </td>
            </tr>

            <tr th:if="${reviews == null || reviews.isEmpty()}">
                <td colspan="6" class="py-5 text-muted">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    Chưa có đánh giá nào từ khách hàng.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
