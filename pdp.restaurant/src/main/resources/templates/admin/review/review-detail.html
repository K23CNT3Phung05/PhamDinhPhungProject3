<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Đánh giá Đơn hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background:#f5f7fb; font-family: 'Segoe UI', sans-serif; margin:0; }
        .page-container { width:100%; padding:25px 40px; }
        .card-custom {
            border-radius:15px;
            padding:30px;
            background:#fff;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
            max-width: 800px;
            margin: auto;
        }
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        .info-label { width: 180px; font-weight: 600; color: #495057; }
        .info-value { flex: 1; color: #212529; }
        .star-filled { color: #ffb100; font-size: 1.2rem; }
        .btn-back {
            margin-top:25px;
            display:inline-flex;
            align-items: center;
            gap: 8px;
            background:#6c757d;
            padding:10px 20px;
            border-radius:8px;
            color:#fff;
            text-decoration:none;
            transition: 0.3s;
        }
        .btn-back:hover { background:#495057; color: white; transform: translateX(-5px); }
        .dish-item { background: #f8f9fa; padding: 5px 12px; border-radius: 6px; margin-bottom: 5px; display: inline-block; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="page-container">
    <div class="card-custom">
        <h2 class="mb-4 text-primary fw-bold">Chi tiết Đánh giá Đơn hàng #<span th:text="${review.id}"></span></h2>

        <div class="info-row">
            <div class="info-label">Khách hàng:</div>
            <div class="info-value">
                <span class="fw-bold" th:text="${review.customerName}"></span>
                (<span th:text="${review.customerPhone}"></span>)
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">Tài khoản đặt:</div>
            <div class="info-value" th:text="${review.user != null ? review.user.email : 'Khách vãng lai'}"></div>
        </div>

        <div class="info-row">
            <div class="info-label">Danh sách món:</div>
            <div class="info-value">
                <div th:each="item : ${review.orderItems}" class="dish-item me-2">
                    <span th:text="${item.dishName}"></span> x<span th:text="${item.quantity}"></span>
                </div>
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">Mức độ hài lòng:</div>
            <div class="info-value">
                <span class="star-filled">
                    <i th:each="i : ${#numbers.sequence(1, review.rating)}" class="bi bi-star-fill"></i>
                </span>
                <span class="ms-2" th:text="${review.rating + ' / 5 sao'}"></span>
            </div>
        </div>

        <div class="info-row" style="border-bottom: none;">
            <div class="info-label">Nội dung đánh giá:</div>
            <div class="info-value">
                <div class="p-3 bg-light rounded" style="min-height: 80px; font-style: italic;">
                    "[[${review.reviewComment != null ? review.reviewComment : 'Khách hàng không để lại lời nhắn.'}]]"
                </div>
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">Thời gian đánh giá:</div>
            <div class="info-value" th:text="${#temporals.format(review.reviewedAt, 'dd/MM/yyyy HH:mm')}"></div>
        </div>

        <a th:href="@{/admin/review}" class="btn-back">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>
    </div>
</div>

</body>
</html>
