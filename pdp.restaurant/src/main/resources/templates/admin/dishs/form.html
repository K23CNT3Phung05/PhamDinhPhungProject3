<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin món ăn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .form-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: white; }
        .form-label { font-weight: 600; color: #4a5568; margin-bottom: 8px; }
        .form-control, .form-select { border-radius: 10px; padding: 12px; border: 1px solid #e2e8f0; }
        .form-control:focus { border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1); }
        .btn-save { background: #4361ee; border: none; border-radius: 12px; padding: 12px 30px; font-weight: 600; }
        .preview-box { border: 2px dashed #cbd5e0; border-radius: 15px; padding: 10px; text-align: center; background: #f8fafc; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="form-card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0 text-dark">
                        <i class="fas fa-utensils text-primary me-2"></i>
                        <span th:text="${dish.id == null ? 'Thêm món mới' : 'Cập nhật món ăn'}"></span>
                    </h2>
                    <a th:href="@{/admin/dishs}" class="btn btn-light rounded-pill px-4">Hủy bỏ</a>
                </div>

                <form th:action="@{/admin/dishs/save}" th:object="${dish}" method="post">
                    <input type="hidden" th:field="*{id}"/>

                    <div class="row g-4">
                        <div class="col-md-7">
                            <label class="form-label">Tên món ăn <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="Ví dụ: Phở bò tái lăn" required>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label">Danh mục món <span class="text-danger">*</span></label>
                            <select class="form-select" name="categoryId" required>
                                <option value="" disabled th:selected="${dish.category == null}">-- Chọn loại món --</option>
                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.name}"
                                        th:selected="${dish.category != null} ? ${c.id} == ${dish.category.id} : false">
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Mô tả chi tiết</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Ghi chú về nguyên liệu, hương vị..."></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="number" class="form-control" th:field="*{price}" required>
                                <span class="input-group-text bg-white">đ</span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Số lượng sẵn có <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" th:field="*{stockQuantity}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Link ảnh món ăn (URL)</label>
                            <input type="text" class="form-control mb-3" th:field="*{imageUrl}" placeholder="https://image-link.com/dish.jpg">
                            <div class="preview-box" th:if="*{imageUrl != null}">
                                <p class="small text-muted mb-2">Xem trước hình ảnh:</p>
                                <img th:src="*{imageUrl}" style="max-height: 200px; border-radius: 10px;" alt="Preview">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Trạng thái hiển thị</label>
                            <select class="form-select" th:field="*{active}">
                                <option th:value="true" th:selected="*{active} == true">Hiển thị</option>
                                <option th:value="false" th:selected="*{active} == false">Ẩn</option>
                            </select>
                        </div>

                    </div>

                    <div class="mt-5 border-top pt-4 text-end">
                        <button type="submit" class="btn btn-primary btn-save shadow">
                            <i class="fas fa-check-circle me-1"></i> Lưu thông tin ngay
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
