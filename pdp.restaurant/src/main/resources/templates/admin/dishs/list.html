<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách món ăn - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fa; }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; }
        .main-card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .table img { border-radius: 10px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-add { background: var(--primary); border: none; border-radius: 10px; padding: 10px 20px; transition: 0.3s; }
        .btn-add:hover { background: #3046bc; transform: translateY(-2px); }
        .badge-stock { padding: 6px 12px; border-radius: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}"><i class="fas fa-utensils me-2"></i>ADMIN PANEL</a>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm rounded-pill px-3">Trang chủ</a>
    </div>
</nav>

<div class="container">
    <div class="card main-card">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold text-dark"><i class="fas fa-list-ul me-2 text-primary"></i>Danh sách thực đơn</h4>
            <a th:href="@{/admin/dishs/add}" class="btn btn-primary btn-add shadow-sm">
                <i class="fas fa-plus-circle me-1"></i> Thêm món mới
            </a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr class="text-secondary">
                        <th class="ps-4">ID</th>
                        <th>Ảnh</th>
                        <th>Thông tin món</th>
                        <th>Đơn giá</th>
                        <th>Danh mục</th>
                        <th>Kho</th>
                        <th>Trạng thái</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${dishes}">
                        <td class="ps-4 fw-bold" th:text="${d.id}"></td>
                        <td>
                            <img th:src="${d.imageUrl != null && d.imageUrl != '' ? d.imageUrl : 'https://via.placeholder.com/60'}"
                                 width="60" height="60" alt="Dish">
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${d.name}"></div>
                            <small class="text-muted" th:text="${#strings.abbreviate(d.description, 40)}"></small>
                        </td>
                        <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(d.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        <td><span class="badge bg-light text-dark border" th:text="${d.category != null ? d.category.name : 'N/A'}"></span></td>
                        <td th:text="${d.stockQuantity}"></td>
                        <td>
                                <span class="badge badge-stock"
                                      th:classappend="${d.stockQuantity > 0} ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'"
                                      th:text="${d.stockQuantity > 0 ? 'Còn hàng' : 'Hết hàng'}">
                                </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/dishs/edit/{id}(id=${d.id})}" class="btn btn-sm btn-outline-warning border-0 me-1">
                                <i class="fas fa-edit fa-lg"></i>
                            </a>
                            <a th:href="@{/admin/dishs/delete/{id}(id=${d.id})}"
                               class="btn btn-sm btn-outline-danger border-0"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa món này?')">
                                <i class="fas fa-trash-alt fa-lg"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(dishes)}">
                        <td colspan="8" class="text-center py-5 text-muted">Chưa có món ăn nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
