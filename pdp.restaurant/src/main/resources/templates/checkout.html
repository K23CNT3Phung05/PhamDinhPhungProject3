<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán | Xác Nhận Đơn Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #ff4757;
        }
        body {
            background: #f4f7f6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #2d3436;
        }
        /* Header Styling */
        .page-header {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 0;
            margin-bottom: -60px;
        }
        /* Card Styling */
        .custom-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 25px;
        }
        .card-title-premium {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4834d4;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Form Styling */
        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #dfe6e9;
            background: #fdfdfd;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }
        /* Payment Method Radio */
        .payment-option {
            border: 2px solid #f1f2f6;
            border-radius: 15px;
            padding: 15px;
            transition: 0.3s;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .payment-option:hover { background: #f8f9fa; }
        .form-check-input:checked + .payment-content { color: #4834d4; }

        /* Summary Styling */
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .total-highlight {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #eef2ff;
        }
        .free-badge {
            background: #e1fdf0;
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        /* Checkout Button */
        .btn-checkout {
            background: var(--primary-gradient);
            border: none;
            border-radius: 15px;
            padding: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            color: white;
        }
        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>

<div class="page-header">
    <div class="container text-center">
        <h1 class="fw-bold">Hoàn tất đơn hàng</h1>
        <p class="opacity-75">Chỉ còn một bước nữa thôi!</p>
    </div>
</div>

<div class="container py-5 mt-4">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="custom-card p-4">
                <div class="card-title-premium">
                    <i class="bi bi-person-badge-fill"></i> Thông tin khách hàng
                </div>
                <form th:action="@{/orders/create}" method="post" id="mainOrderForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">HỌ VÀ TÊN</label>
                            <input type="text" name="fullName" class="form-control" placeholder="Nhập họ tên..." required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted">SỐ ĐIỆN THOẠI</label>
                            <input type="text" name="phone" class="form-control" placeholder="Nhập số điện thoại..." required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted">ĐỊA CHỈ NHẬN HÀNG</label>
                            <textarea name="shippingAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, quận/huyện..." required></textarea>
                        </div>
                    </div>

                    <div class="card-title-premium mt-4">
                        <i class="bi bi-wallet2"></i> Phương thức thanh toán
                    </div>
                    <div class="payment-options">
                        <div class="payment-option d-flex align-items-center gap-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="pay1" value="CASH" checked>
                            <label for="pay1" class="mb-0">
                                <strong>Tiền mặt khi nhận hàng (COD)</strong>
                            </label>
                        </div>
                        <div class="payment-option d-flex align-items-center gap-3">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="pay2" value="QR_PAY">
                            <label for="pay2" class="mb-0">
                                <strong>Chuyển khoản / QR Code</strong>
                            </label>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label small fw-bold text-muted">GHI CHÚ</label>
                        <textarea name="note" class="form-control" rows="2" placeholder="Lời nhắn cho cửa hàng hoặc tài xế..."></textarea>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="custom-card p-4">
                <div class="card-title-premium">
                    <i class="bi bi-bag-check-fill"></i> Chi tiết đơn hàng
                </div>

                <div class="order-items mb-4">
                    <div th:each="item : ${cartItems}" class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="fw-bold" th:text="${item.dishName}">Tên món</span>
                            <div class="small text-muted">Số lượng: [[${item.quantity}]]</div>
                        </div>
                        <span class="fw-bold text-dark" th:text="${#numbers.formatInteger(item.subTotal != null ? item.subTotal : 0, 1, 'POINT')} + ' ₫'"></span>
                    </div>
                </div>

                <hr class="text-muted opacity-25">

                <div class="summary-details my-4">
                    <div class="summary-item">
                        <span class="text-muted">Tạm tính</span>
                        <span th:text="${#numbers.formatInteger(total != null ? total : 0, 1, 'POINT')} + ' ₫'"></span>
                    </div>
                    <div class="summary-item align-items-center">
                        <span class="text-muted">Phí giao hàng</span>
                        <span class="free-badge">Miễn phí</span>
                    </div>
                </div>

                <div class="total-highlight d-flex justify-content-between align-items-center mb-4">
                    <span class="h6 mb-0 fw-bold">Tổng cộng</span>
                    <span class="h3 mb-0 fw-bold text-primary"
                          th:text="${#numbers.formatInteger(total != null ? total : 0, 1, 'POINT')} + ' ₫'"></span>
                </div>

                <input type="hidden" name="shippingFee" value="0" form="mainOrderForm">

                <button type="submit" form="mainOrderForm" class="btn btn-checkout w-100 mb-3">
                    XÁC NHẬN ĐẶT HÀNG <i class="bi bi-arrow-right-short"></i>
                </button>

                <p class="text-center mb-0">
                    <a th:href="@{/cart}" class="text-muted small text-decoration-none">
                        <i class="bi bi-chevron-left"></i> Quay lại giỏ hàng
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
