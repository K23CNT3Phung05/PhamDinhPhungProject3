<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --dark: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 40px 30px;
            text-align: center;
        }

        .login-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-control {
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .btn-login:hover { opacity: 0.9; }
        .alert { border-radius: 12px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div class="login-icon">
            <i class="fas fa-sign-in-alt"></i>
        </div>
        <h2>Đăng nhập tài khoản</h2>
        <p>Nhập email hoặc tên để đăng nhập</p>
    </div>
    <div class="login-body">

        <!-- Thông báo lỗi / thành công -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Form login -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email hoặc Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" id="email" name="email" class="form-control" placeholder="Nhập email hoặc tên" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Đăng nhập
            </button>
        </form>

        <div class="text-center mt-4">
            <p>Chưa có tài khoản? <a th:href="@{/register}" class="fw-bold">Đăng ký</a></p>
            <a th:href="@{ / }" class="fw-bold text-decoration-none">
                <i class="fas fa-home me-1"></i> Về trang chủ
            </a>
        </div>

    </div>
</div>
</body>
</html>
